[package]
name = "infra-import"
version = "0.2.0"
edition = "2021"
description = "Scan existing AWS infrastructure via CLI and generate Terraform code"

[[bin]]
name = "infra-import"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
indicatif = "0.17"
anyhow = "1"

[profile.dev]
opt-level = 0
debug = "limited"
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
